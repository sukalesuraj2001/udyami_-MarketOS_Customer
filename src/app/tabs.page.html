<ion-tabs>
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom" class="main-tabs">
    <ion-tab-button tab="dashboard" routerLink="/tabs/dashboard">
      <span class="icon-pill"><ion-icon name="home-outline"></ion-icon></span>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="approvals" routerLink="/tabs/approvals">
      <span class="icon-pill">
        <ion-icon name="checkmark-done-outline"></ion-icon>
        @if (badges.pendingContent() > 0) {
          <span class="tab-badge">{{ badges.pendingContent() }}</span>
        }
      </span>
      <ion-label>Content</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="ai" routerLink="/tabs/ai">
      <span class="icon-pill"><ion-icon name="sparkles-outline"></ion-icon></span>
      <ion-label>AI</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="leads" routerLink="/tabs/leads">
      <span class="icon-pill">
        <ion-icon name="file-tray-outline"></ion-icon>
        @if (badges.newLeads() > 0) {
          <span class="tab-badge">{{ badges.newLeads() }}</span>
        }
      </span>
      <ion-label>Leads</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="membership" routerLink="/tabs/membership">
      <span class="icon-pill"><ion-icon name="ribbon-outline"></ion-icon></span>
      <ion-label>Plan</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
